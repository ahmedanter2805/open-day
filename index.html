<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC72C">
<title>Enactus | Innovation University</title>
<meta name="description" content="اتعرف على Enactus: طلاب بيحوّلوا أفكارهم لمشاريع بتغيّر حياة ناس حقيقية.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%94%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Caveat:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#26221E; --yellow:#FFC72C; --paper:#FBF6EA; --kraft:#C9AB80; --denim:#2E4A66;
  --pink:#F2C9C1; --mint:#C4DFD0; --sunny:#FFE27A;
  --shadow:0 10px 22px rgba(38,34,30,.30);
  --hand:"Caveat","Aref Ruqaa",cursive;
  --ruq:"Aref Ruqaa","Caveat",serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);font-family:var(--body);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:3px solid var(--denim);outline-offset:3px}
.t-ink :focus-visible,.t-denim :focus-visible{outline-color:var(--yellow)}
h1,h2,h3,p{margin:0}

/* ---------- pages ---------- */
.page{position:relative;min-height:100svh;padding:76px 20px 84px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;isolation:isolate}
.page::after{content:"";position:absolute;inset:0;background-image:var(--grain);opacity:.4;mix-blend-mode:multiply;pointer-events:none;z-index:0}
.has-edge::before{content:"";position:absolute;top:0;left:0;right:0;height:14px;z-index:2;
  background:linear-gradient(135deg,var(--edge) 25%,transparent 25%) -7px 0/14px 14px,linear-gradient(225deg,var(--edge) 25%,transparent 25%) -7px 0/14px 14px}
.wrap{width:100%;max-width:560px;margin-inline:auto;position:relative;z-index:1}
@media(min-width:900px){.wrap{max-width:980px}}

.t-stripes{background:repeating-linear-gradient(90deg,#FFD25A 0 44px,#FBF6EA 44px 88px)}
.t-kraft{background-color:var(--kraft)}
.t-ink{background:var(--ink);color:var(--paper)}
.t-paper{background:var(--paper)}
.t-denim{background:var(--denim);color:var(--paper)}
.t-grid{background-color:var(--paper);background-image:linear-gradient(rgba(46,74,102,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(46,74,102,.16) 1px,transparent 1px);background-size:26px 26px}
.t-yellow{background:var(--yellow)}

.title{font-family:var(--ruq);font-weight:700;font-size:clamp(2.2rem,9vw,3.6rem);line-height:1.45;margin-bottom:.35em}
.hand{font-family:var(--hand);font-weight:500}
.lead{font-size:1.05rem;max-width:34em}

/* ---------- scrapbook parts ---------- */
.tape{position:absolute;width:96px;height:30px;background:rgba(255,199,44,.88);z-index:3;pointer-events:none;
  clip-path:polygon(3% 0,97% 0,100% 12%,97% 25%,100% 37%,97% 50%,100% 62%,97% 75%,100% 87%,97% 100%,3% 100%,0 87%,3% 75%,0 62%,3% 50%,0 37%,3% 25%,0 12%)}
.tape.blue{background:rgba(46,74,102,.8)}
.tape.pink{background:rgba(242,201,193,.92)}
.tape.tc{top:-14px;left:50%;margin-left:-48px;transform:rotate(-3deg)}
.tape.tl{top:-10px;left:-22px;transform:rotate(-38deg)}
.tape.tr{top:-10px;right:-22px;transform:rotate(38deg)}

.stamp{--paper:#FBF6EA;position:relative;padding:16px;filter:drop-shadow(0 8px 12px rgba(38,34,30,.30));
  background:
   radial-gradient(circle at 50% 0,#0000 4px,var(--paper) 4.5px) top/14px 7px repeat-x,
   radial-gradient(circle at 50% 100%,#0000 4px,var(--paper) 4.5px) bottom/14px 7px repeat-x,
   radial-gradient(circle at 0 50%,#0000 4px,var(--paper) 4.5px) left/7px 14px repeat-y,
   radial-gradient(circle at 100% 50%,#0000 4px,var(--paper) 4.5px) right/7px 14px repeat-y,
   linear-gradient(var(--paper),var(--paper)) center/calc(100% - 14px) calc(100% - 14px) no-repeat}
.stamp>img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#e9dfc8}

.polaroid{background:#fff;padding:12px 12px 54px;box-shadow:var(--shadow);position:relative;width:100%}
.polaroid>img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#e9dfc8}
.cap{position:absolute;bottom:10px;inset-inline:10px;text-align:center;font-family:var(--ruq);font-size:1.15rem;line-height:1.3;color:var(--ink)}
.rot-a{transform:rotate(-3.5deg)}.rot-b{transform:rotate(3deg)}.rot-c{transform:rotate(-1.5deg)}.rot-d{transform:rotate(2.5deg)}

.note{position:relative;background-color:var(--paper);color:var(--ink);padding:26px 22px 22px;box-shadow:var(--shadow)}
.note .lined{line-height:32px;background:repeating-linear-gradient(transparent 0 31px,rgba(46,74,102,.16) 31px 32px)}
.note h2,.note h3{font-family:var(--ruq);line-height:1.5}

.sticky{position:relative;padding:22px 16px 18px;box-shadow:var(--shadow);color:var(--ink);background:var(--sunny)}
.sticky::before{content:"";position:absolute;top:-8px;left:50%;width:56px;height:16px;margin-left:-28px;background:rgba(255,255,255,.55)}
.sticky h3{font-family:var(--ruq);font-size:1.15rem;line-height:1.5;margin:.15em 0}
.sticky p{font-size:.92rem;line-height:1.65}
.sticky .ic{font-size:1.8rem;line-height:1}

/* ---------- cover ---------- */
.cover{text-align:center}
.cover-kicker{font-size:1.6rem}
.cover-title{font-family:var(--hand);font-weight:700;font-size:clamp(4.6rem,25vw,9.5rem);line-height:.95;letter-spacing:.01em}
.squig{display:block;width:58%;max-width:280px;height:16px;margin:.1em auto 0}
.cover-sub{font-size:clamp(1.05rem,4.2vw,1.3rem);font-weight:500;max-width:21em;margin:.9em auto 1.8em}
.cover-stamp{width:min(76vw,330px);margin:0 auto;transform:rotate(-2deg);animation:paste .9s cubic-bezier(.2,1.4,.4,1) .3s both}
@keyframes paste{from{transform:translateY(-46px) scale(1.15) rotate(7deg);opacity:0}to{transform:rotate(-2deg);opacity:1}}
.cover-event{font-size:1.7rem;margin-top:1.3rem}
.scroll-hint{margin-top:1.4rem;font-family:var(--ruq);font-size:1.1rem}
.scroll-hint i{display:block;font-style:normal;font-size:1.6rem;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}

/* ---------- about ---------- */
.about-grid{display:grid;gap:34px;align-items:center}
@media(min-width:800px){.about-grid{grid-template-columns:5fr 6fr;gap:56px}}
.about-photo{max-width:380px;margin-inline:auto}
.equation{font-family:var(--hand);font-size:1.5rem;color:var(--denim);margin-top:14px;line-height:1.3}
.values{display:flex;flex-wrap:wrap;gap:20px;margin-top:26px;justify-content:center}
.values .sticky{flex:0 1 150px;padding:18px 14px 14px;text-align:center}
.values .sticky:nth-child(1){transform:rotate(-3deg)}
.values .sticky:nth-child(2){transform:rotate(2deg);background:var(--pink)}
.values .sticky:nth-child(3){transform:rotate(-1.5deg);background:var(--mint)}
.values .sticky h3{margin:0;font-size:1.05rem}

/* ---------- stats ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:24px}
@media(min-width:800px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.ticket{color:var(--ink);text-align:center;padding:24px 10px 18px}
.ticket.y{--paper:#FFC72C}
.ticket:nth-child(odd){transform:rotate(-2deg)}.ticket:nth-child(even){transform:rotate(1.8deg)}
.ticket .num{display:block;font-family:var(--hand);font-weight:700;font-size:clamp(3rem,13vw,4.4rem);line-height:1;unicode-bidi:isolate}
.ticket .lbl{display:block;font-weight:600;font-size:.98rem;margin-top:6px;line-height:1.4}

/* ---------- projects ---------- */
.chip{position:relative;display:inline-block;background:var(--yellow);color:var(--ink);font-weight:600;font-size:.95rem;padding:3px 26px;margin-bottom:12px;transform:rotate(-2deg);
  clip-path:polygon(3% 0,97% 0,100% 15%,97% 30%,100% 45%,97% 60%,100% 75%,97% 100%,3% 100%,0 75%,3% 60%,0 45%,3% 30%,0 15%)}
.film-wrap{position:relative;background:#1d1a17;padding:30px 0;margin:16px 0 8px;box-shadow:var(--shadow)}
.film-wrap::before,.film-wrap::after{content:"";position:absolute;left:0;right:0;height:11px;background:repeating-linear-gradient(90deg,var(--paper) 0 12px,transparent 12px 27px);opacity:.92;pointer-events:none}
.film-wrap::before{top:9px}.film-wrap::after{bottom:9px}
.film{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.film::-webkit-scrollbar{display:none}
.frame{flex:0 0 76%;scroll-snap-align:center}
@media(min-width:800px){.frame{flex-basis:calc(33.3% - 8px)}}
.frame img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#e9dfc8;cursor:zoom-in}
.hint{font-family:var(--ruq);font-size:.95rem;opacity:.85;margin-bottom:20px}
.proj-body{display:grid;gap:26px;align-items:start}
@media(min-width:800px){.proj-body{grid-template-columns:3fr 2fr}}
.impact{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.badge{width:118px;height:118px;border-radius:50%;background:var(--yellow);color:var(--ink);display:grid;place-content:center;text-align:center;box-shadow:var(--shadow);outline:2px dashed rgba(38,34,30,.55);outline-offset:-9px;padding:8px}
.badge:nth-child(odd){transform:rotate(-7deg)}.badge:nth-child(even){transform:rotate(6deg);background:var(--paper)}
.badge .num{font-family:var(--hand);font-weight:700;font-size:2.5rem;line-height:1;unicode-bidi:isolate}
.badge .lbl{font-size:.82rem;font-weight:600;line-height:1.3}

/* ---------- tech ---------- */
.sticky-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:26px;margin-top:30px}
.sticky-grid .sticky:nth-child(3n+1){transform:rotate(-2deg)}
.sticky-grid .sticky:nth-child(3n+2){transform:rotate(1.6deg);background:var(--pink)}
.sticky-grid .sticky:nth-child(3n){transform:rotate(-1deg);background:var(--mint)}
.made-by{margin-top:32px;font-family:var(--hand);font-size:1.5rem;color:var(--denim)}

/* ---------- timeline ---------- */
.tl{position:relative;list-style:none;margin:28px 0 0;padding:0;padding-inline-start:36px}
.tl::before{content:"";position:absolute;inset-inline-start:11px;top:6px;bottom:6px;border-inline-start:3px dashed var(--denim)}
.tl li{position:relative;margin-bottom:30px}
.tl li::before{content:"";position:absolute;inset-inline-start:-31px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink)}
.tl .date{font-family:var(--hand);font-weight:700;font-size:1.5rem;color:var(--denim);line-height:1.2;direction:ltr;text-align:start;unicode-bidi:isolate;display:inline-block}
.tl h3{font-family:var(--ruq);font-size:1.3rem;line-height:1.5}
.tl p{max-width:32em}

/* ---------- members ---------- */
.member-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px 20px;margin-top:26px}
@media(min-width:700px){.member-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.member-grid{grid-template-columns:repeat(4,1fr)}}
.flip{display:block;width:100%;perspective:900px}
.flip:nth-child(4n+1){transform:rotate(-2.5deg)}.flip:nth-child(4n+2){transform:rotate(2deg)}
.flip:nth-child(4n+3){transform:rotate(1.5deg)}.flip:nth-child(4n){transform:rotate(-2deg)}
.flip-inner{display:block;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.2,.5,1)}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{display:block;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.flip .back{position:absolute;inset:0;transform:rotateY(180deg);background:var(--yellow);padding:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px}
.back .role{font-family:var(--ruq);font-weight:700;font-size:1.2rem;line-height:1.5}
.back .line{font-size:.88rem;line-height:1.55}

/* ---------- achievements ---------- */
.awards{margin-top:26px;display:grid;gap:16px}
.award{display:flex;gap:16px;align-items:center;background:var(--paper);color:var(--ink);padding:16px 18px;box-shadow:var(--shadow)}
.award:nth-child(odd){transform:rotate(-.8deg)}.award:nth-child(even){transform:rotate(.8deg)}
.award .star{flex:none;width:48px;height:48px;border-radius:50%;background:var(--yellow);display:grid;place-content:center;font-size:1.4rem;outline:2px dashed rgba(38,34,30,.5);outline-offset:-5px}
.award h3{font-family:var(--ruq);font-size:1.15rem;line-height:1.5}
.award p{font-size:.92rem;line-height:1.55}

/* ---------- join ---------- */
.join{text-align:center}
.big{font-family:var(--ruq);font-weight:700;font-size:clamp(2.6rem,11vw,4.6rem);line-height:1.4}
.join .lead{margin:.6em auto 1.8em}
.btns{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.btn{display:inline-block;background:var(--ink);color:var(--paper);padding:.7em 1.5em;font-weight:600;font-size:1.05rem;text-decoration:none;box-shadow:5px 5px 0 var(--denim);transform:rotate(-1deg);transition:transform .15s,box-shadow .15s}
.btn.alt{background:var(--paper);color:var(--ink);box-shadow:5px 5px 0 var(--ink);transform:rotate(1deg)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--denim)}
.credit{margin-top:3rem;font-family:var(--hand);font-size:1.5rem;line-height:1.4}

/* ---------- fixed UI ---------- */
.progress{position:fixed;top:0;left:0;right:0;height:6px;z-index:50}
.progress i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--yellow) 0 8px,var(--ink) 8px 16px);box-shadow:0 1px 0 rgba(255,255,255,.4)}
.pager{position:fixed;top:16px;inset-inline-start:14px;z-index:50;background:var(--paper);color:var(--ink);font-family:var(--hand);font-weight:700;font-size:1.25rem;line-height:1.2;padding:2px 14px;transform:rotate(-3deg);box-shadow:0 4px 10px rgba(0,0,0,.25);direction:ltr}
.demo{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--ink);color:var(--yellow);text-align:center;font-size:.8rem;padding:6px 10px;font-weight:600}
.lb{position:fixed;inset:0;background:rgba(20,18,16,.93);display:none;place-items:center;z-index:100;padding:16px;cursor:zoom-out}
.lb.open{display:grid}
.lb img{max-height:88vh;max-width:100%;border:10px solid #fff;border-bottom-width:34px;box-shadow:0 20px 50px rgba(0,0,0,.5)}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>

<noscript><p style="padding:24px;color:#fff;background:#26221E">فعّل JavaScript عشان تشوف الصفحة.</p></noscript>
<div class="progress" aria-hidden="true"><i id="bar"></i></div>
<div class="pager" id="pager" aria-hidden="true">1 / 1</div>
<main id="app"></main>
<div class="lb" id="lb" role="dialog" aria-label="عرض الصورة"><img alt=""></div>
<div class="demo" id="demo" hidden>نسخة تجريبية: عدّل المحتوى في الأعلى واكتب demo: false قبل ما تنشر</div>

<script>

      { name: "اسم العضو", role: "فريق التقنية",   line: "جملة قصيرة عنه", photo: "photos/m2.jpg" },
      { name: "اسم العضو", role: "فريق المشاريع",  line: "جملة قصيرة عنه", photo: "photos/m3.jpg" },
      { name: "اسم العضو", role: "فريق التسويق",   line: "جملة قصيرة عنه", photo: "photos/m4.jpg" },
      { name: "اسم العضو", role: "فريق العلاقات",  line: "جملة قصيرة عنه", photo: "photos/m5.jpg" },
      { name: "اسم العضو", role: "فريق الموارد",   line: "جملة قصيرة عنه", photo: "photos/m6.jpg" }
    ]
  },

  achievements: {
    title: "لحظات نفتخر بيها",
    items: [
      { title: "اكتب إنجاز أو جايزة", text: "سطر يوضّح إيه اللي حصل ومتى." },
      { title: "اكتب شراكة أو مشاركة", text: "سطر يوضّح إيه اللي حصل ومتى." },
      { title: "اكتب لحظة مميزة",     text: "سطر يوضّح إيه اللي حصل ومتى." }
    ]
  },

  join: {
    title: "خليك جزء من الحكاية",
    text: "التسجيل في Enactus بيفتح كل سنة. سيب بياناتك وهنتواصل معاك.",
    buttons: [
      { label: "سجّل معانا",   url: "#", primary: true },
      { label: "Instagram",     url: "#" },
      { label: "Facebook",      url: "#" }
    ],
    share: "شارك الصفحة"
  }
};
/* ===================== نهاية المحتوى ===================== */

(function(){
  const C = CONTENT;
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* صورة بديلة لو الصورة الحقيقية مش موجودة */
  window.PH = function(label){
    label = label || "ضع الصورة هنا";
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450"><rect width="600" height="450" fill="#E9DFC8"/><g fill="none" stroke="#B49A6D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="230" y="160" width="140" height="105" rx="12"/><circle cx="300" cy="212" r="26"/><path d="M262 160l10-18h56l10 18"/></g><text x="300" y="322" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#8C744A">' + label + '</text></svg>';
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  };
  const img = (src, alt, extra) => `<img src="${src ? esc(src) : PH()}" alt="${esc(alt || "")}" ${extra || 'loading="lazy"'} decoding="async" onerror="this.onerror=null;this.src=PH()">`;
  const num = (n, suffix) => `<span class="num" dir="ltr" data-to="${Number(n) || 0}" data-suffix="${esc(suffix || "")}">${Number(n) || 0}${esc(suffix || "")}</span>`;

  /* ملمس الورق */
  const grain = "<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .15  0 0 0 0 .12  0 0 0 0 .1  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(#n)'/></svg>";
  document.documentElement.style.setProperty("--grain", 'url("data:image/svg+xml,' + encodeURIComponent(grain) + '")');
  document.title = C.team.name + " | " + C.team.university;

  const EDGE = { stripes:"#FBF6EA", kraft:"#C9AB80", ink:"#26221E", paper:"#FBF6EA", denim:"#2E4A66", grid:"#FBF6EA", yellow:"#FFC72C" };
  const pages = [];

  /* 1. الغلاف */
  pages.push({ theme:"stripes", cls:"cover", html:`
    <div class="wrap">
      <p class="hand cover-kicker">${esc(C.team.university)}</p>
      <h1 class="cover-title">${esc(C.team.name)}</h1>
      <svg class="squig" viewBox="0 0 300 16" preserveAspectRatio="none" aria-hidden="true"><path d="M2 9 C 25 1, 45 17, 70 9 S 115 1, 140 9 S 185 17, 210 9 S 255 1, 298 9" fill="none" stroke="#2E4A66" stroke-width="5" stroke-linecap="round"/></svg>
      <p class="cover-sub">${esc(C.team.tagline)}</p>
      <div class="stamp cover-stamp"><span class="tape tl"></span><span class="tape blue tr"></span>${img(C.team.cover, C.team.name, 'loading="eager"')}</div>
      <p class="hand cover-event">${esc(C.team.event)}</p>
      <p class="scroll-hint">اسحب لتحت<i aria-hidden="true">↓</i></p>
    </div>` });

  /* 2. مين إحنا */
  const A = C.about;
  pages.push({ theme:"kraft", html:`
    <div class="wrap">
      <div class="about-grid">
        <div class="about-photo">
          <div class="polaroid rot-a"><span class="tape tc"></span>${img(A.photo, A.photoCaption)}<span class="cap">${esc(A.photoCaption)}</span></div>
        </div>
        <div>
          <div class="note rot-d"><span class="tape blue tl"></span>
            <h2 class="title" style="font-size:clamp(2rem,8vw,2.8rem)">${esc(A.title)}</h2>
            <p class="lined">${esc(A.text)}</p>
            <p class="equation" dir="ltr">${esc(A.equation)}</p>
          </div>
        </div>
      </div>
      <div class="values">${A.values.map(v => `<div class="sticky"><h3>${esc(v)}</h3></div>`).join("")}</div>
    </div>` });

  /* 3. الأرقام */
  pages.push({ theme:"ink", html:`
    <div class="wrap">
      <h2 class="title" style="text-align:center">${esc(C.stats.title)}</h2>
      <div class="stat-grid">${C.stats.items.map((s, i) => `
        <div class="stamp ticket${i % 2 ? " y" : ""}">${num(s.n, s.suffix)}<span class="lbl">${esc(s.label)}</span></div>`).join("")}
      </div>
    </div>` });

  /* 4. المشاريع */
  C.projects.forEach((p, i) => {
    pages.push({ theme: i % 2 ? "paper" : "denim", html:`
      <div class="wrap">
        <span class="chip">${esc(p.tag)}</span>
        <h2 class="title">${esc(p.title)}</h2>
        <div class="film-wrap"><div class="film">${p.photos.map((ph, k) => `<div class="frame">${img(ph, p.title + " - " + (k + 1))}</div>`).join("")}</div></div>
        <p class="hint">اضغط على أي صورة لتكبيرها</p>
        <div class="proj-body">
          <div class="note"><span class="tape tc"></span><p class="lined">${esc(p.text)}</p></div>
          <div class="impact">${p.impact.map(m => `<div class="badge">${num(m.n, m.suffix)}<span class="lbl">${esc(m.label)}</span></div>`).join("")}</div>
        </div>
      </div>` });
  });

  /* 5. فريق التقنية */
  const T = C.tech;
  pages.push({ theme:"grid", html:`
    <div class="wrap">
      <h2 class="title">${esc(T.title)}</h2>
      <p class="lead">${esc(T.text)}</p>
      <div class="sticky-grid">${T.items.map(t => `<div class="sticky"><span class="ic" aria-hidden="true">${t.icon}</span><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p></div>`).join("")}</div>
      <p class="made-by">${esc(T.madeBy)}</p>
    </div>` });

  /* 6. الرحلة */
  pages.push({ theme:"paper", html:`
    <div class="wrap">
      <h2 class="title">${esc(C.timeline.title)}</h2>
      <ol class="tl">${C.timeline.items.map(t => `<li><span class="date">${esc(t.date)}</span><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p></li>`).join("")}</ol>
    </div>` });

  /* 7. الأعضاء */
  const M = C.members;
  pages.push({ theme:"kraft", html:`
    <div class="wrap">
      <h2 class="title" style="text-align:center">${esc(M.title)}</h2>
      <p class="hint" style="text-align:center">${esc(M.hint)}</p>
      <div class="member-grid">${M.items.map(m => `
        <button class="flip" type="button" aria-pressed="false" aria-label="${esc(m.name)}، اضغط لمعرفة دوره">
          <span class="flip-inner">
            <span class="face front polaroid">${img(m.photo, m.name)}<span class="cap">${esc(m.name)}</span></span>
            <span class="face back polaroid"><span class="role">${esc(m.role)}</span><span class="line">${esc(m.line)}</span></span>
          </span>
        </button>`).join("")}
      </div>
    </div>` });

  /* 8. الإنجازات */
  pages.push({ theme:"denim", html:`
    <div class="wrap">
      <h2 class="title">${esc(C.achievements.title)}</h2>
      <div class="awards">${C.achievements.items.map(a => `<div class="award"><span class="star" aria-hidden="true">★</span><div><h3>${esc(a.title)}</h3><p>${esc(a.text)}</p></div></div>`).join("")}</div>
    </div>` });

  /* 9. انضم لينا */
  const J = C.join;
  pages.push({ theme:"yellow", cls:"join", html:`
    <div class="wrap">
      <h2 class="big">${esc(J.title)}</h2>
      <p class="lead">${esc(J.text)}</p>
      <div class="btns">
        ${J.buttons.map(b => `<a class="btn${b.primary ? "" : " alt"}" href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.label)}</a>`).join("")}
        <button class="btn alt" type="button" id="share">${esc(J.share)}</button>
      </div>
      <p class="credit" dir="ltr">${esc(C.team.name)} ${esc(C.team.university)}</p>
    </div>` });

  document.getElementById("app").innerHTML = pages.map((p, i) =>
    `<section class="page t-${p.theme}${p.cls ? " " + p.cls : ""}${i ? " has-edge" : ""}"${i ? ` style="--edge:${EDGE[pages[i-1].theme]}"` : ""}>${p.html}</section>`
  ).join("");

  if (C.demo) document.getElementById("demo").hidden = false;

  /* تقليب صور الأعضاء */
  document.addEventListener("click", e => {
    const f = e.target.closest(".flip");
    if (f) { const on = f.classList.toggle("flipped"); f.setAttribute("aria-pressed", on); return; }
    const im = e.target.closest(".frame img");
    if (im) { const lb = document.getElementById("lb"); lb.querySelector("img").src = im.src; lb.querySelector("img").alt = im.alt; lb.classList.add("open"); return; }
    if (e.target.closest("#lb")) document.getElementById("lb").classList.remove("open");
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("lb").classList.remove("open"); });

  /* مشاركة الصفحة */
  const sh = document.getElementById("share");
  if (sh) sh.addEventListener("click", async () => {
    const data = { title: document.title, url: location.href };
    try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(location.href); sh.textContent = "تم نسخ اللينك"; } } catch (_) {}
  });

  /* عدّاد الأرقام */
  const nums = [...document.querySelectorAll(".num")];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if ("IntersectionObserver" in window && !reduce) {
    nums.forEach(n => n.textContent = "0" + n.dataset.suffix);
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      if (!en.isIntersecting) return;
      io.unobserve(en.target);
      const el = en.target, to = +el.dataset.to, t0 = performance.now(), d = 1400;
      const tick = t => { const k = Math.min(1, (t - t0) / d), v = Math.round(to * (1 - Math.pow(1 - k, 3)));
        el.textContent = v + el.dataset.suffix; if (k < 1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    }), { threshold: .6 });
    nums.forEach(n => io.observe(n));
  }

  /* رقم الصفحة وشريط التقدم */
  const secs = [...document.querySelectorAll(".page")], pager = document.getElementById("pager"), bar = document.getElementById("bar");
  pager.textContent = "1 / " + secs.length;
  if ("IntersectionObserver" in window) {
    const po = new IntersectionObserver(entries => entries.forEach(en => {
      if (en.isIntersecting) pager.textContent = (secs.indexOf(en.target) + 1) + " / " + secs.length;
    }), { rootMargin: "-45% 0px -45% 0px" });
    secs.forEach(s => po.observe(s));
  }
  let raf = 0;
  addEventListener("scroll", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => {
    const max = document.documentElement.scrollHeight - innerHeight;
    bar.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + "%";
  }); }, { passive: true });
})();
</script>
</body>
</html>
